<style>
:root{--bg:#F2F5F0;--surf:#fff;--ink:#14261C;--mut:#56675C;--line:#D8E0D9;--brand:#1E7A4C;--bink:#fff;--soft:#DDEFE4;--warn:#FBEBCF;--warnt:#8A5208;--gold:#E0A21B;--font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A14;--surf:#16241C;--ink:#E8F0EA;--mut:#A2B3A8;--line:#263A2F;--brand:#4CC38A;--bink:#06231A;--soft:#1B3A2A;--warn:#3A2C12;--warnt:#F0B45A}}
:root[data-theme="dark"]{--bg:#0F1A14;--surf:#16241C;--ink:#E8F0EA;--mut:#A2B3A8;--line:#263A2F;--brand:#4CC38A;--bink:#06231A;--soft:#1B3A2A;--warn:#3A2C12;--warnt:#F0B45A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hd{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.logo{background:none;border:0;padding:0;text-align:left;line-height:1.1}
.logo b{display:block;font-size:26px;font-weight:800;color:var(--brand)}.logo span{font-size:12px;color:var(--mut)}
.search{flex:1;min-width:220px;display:flex;border:2px solid var(--brand);border-radius:12px;overflow:hidden;background:var(--bg)}
.search input{flex:1;border:0;background:none;padding:10px 14px;outline:0;min-width:0}
.search button{border:0;background:var(--brand);color:var(--bink);padding:0 20px;font-weight:700}
.hbtn{position:relative;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:9px 14px;font-weight:500;white-space:nowrap}
.hbtn.pri{background:var(--brand);color:var(--bink);border-color:var(--brand);font-weight:700}
.cnt{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#D6453D;color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700;padding:0 5px}
.cnt:empty,.cnt[data-n="0"]{display:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--bink);font-weight:700}
main{padding:24px 0}
.banner{background:var(--brand);color:var(--bink);border-radius:20px;padding:28px 32px;margin-bottom:24px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.banner h1{font-size:clamp(26px,3.6vw,40px);line-height:1.15;font-weight:800}.banner p{opacity:.9;margin-top:6px}
.perks{display:flex;gap:18px;flex-wrap:wrap;font-weight:500}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar select{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.pc{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.tile{background:var(--soft);aspect-ratio:1/1;display:grid;place-items:center;cursor:pointer;overflow:hidden;width:100%;border:0;padding:0}
.tile svg,.tile img{width:100%;height:100%;object-fit:cover}.tile svg{padding:10%}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surf);font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.bd{position:absolute;top:10px;left:10px;background:var(--warn);color:var(--warnt);font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
.bd.g{background:var(--soft);color:var(--brand)}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-weight:700;line-height:1.3;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.pr{font-size:20px;font-weight:800;color:var(--brand)}
.sm{font-size:13px;color:var(--mut)}
.cmp{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;font-size:14px;cursor:pointer}
.cmp input{width:18px;height:18px;accent-color:var(--brand)}
.btn{border:2px solid var(--brand);background:var(--brand);color:var(--bink);border-radius:12px;padding:11px 22px;font-weight:700}
.btn.o{background:transparent;color:var(--brand)}.btn:disabled{opacity:.45;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px}
.big{background:var(--soft);border-radius:16px;aspect-ratio:1/1;overflow:hidden;display:grid;place-items:center}
.big svg,.big img{width:100%;height:100%;object-fit:cover}.big svg{padding:12%}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;width:34%}
.best{color:var(--brand);font-weight:800}
.tick{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.back{background:none;border:0;color:var(--brand);font-weight:700;padding:0 0 14px}
.price-l{font-size:34px;font-weight:800;color:var(--brand);margin:6px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-weight:700;font-size:14px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.prev{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.prev img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:none}
.tray.on{display:block}
.tray .in{max-width:1240px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.slot{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:6px 12px;min-width:200px;flex:1;max-width:300px}
.slot .th{width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--soft);flex:none}.slot .th svg,.slot .th img{width:100%;height:100%;object-fit:cover}
.slot b{font-size:14px;line-height:1.2}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.dlg{background:var(--surf);border-radius:18px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:24px}
.ci{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .th{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--soft);flex:none}.ci .th svg,.ci .th img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:14px;text-align:center}
@media (max-width:760px){.two{grid-template-columns:1fr}.hbtn span{display:none}}
</style>
</head>

window.imgFail=function(i){var p=byId(+i.dataset.pid);if(!p)return;if(missing.indexOf(p.photo)<0)missing.push(p.photo);var m=$("#miss");m.style.display="block";m.textContent="Không tìm thấy "+missing.length+" ảnh cạnh file HTML: "+missing.join(", ");i.outerHTML=art(p.type,p.col)};
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2200)}
function go(v,id){st.view=v;if(id!=null)st.cur=id;render();window.scrollTo(0,0)}

/* ---------- danh sách ---------- */
function filtered(){
  var l=PRODUCTS.filter(function(p){
    if(st.favOnly&&!st.fav[p.id])return false;
    if(st.cat!=="Tất cả"&&p.cat!==st.cat)return false;
    if(st.cond&&p.cond!==st.cond)return false;
    if(st.q){var h=(p.name+" "+p.cat+" "+p.seller).toLowerCase();if(h.indexOf(st.q.toLowerCase())<0)return false}
    return true});
  if(st.sort==="asc")l.sort(function(a,b){return a.price-b.price});
  if(st.sort==="desc")l.sort(function(a,b){return b.price-a.price});
  if(st.sort==="rate")l.sort(function(a,b){return b.rate-a.rate});
  if(st.sort==="new")l.sort(function(a,b){return b.id-a.id});
  return l;
}
function card(p){
  var on=st.cmp.indexOf(p.id)>=0;
  return '<article class="pc"><button class="tile" data-open="'+p.id+'" aria-label="Xem '+esc(p.name)+'">'+img(p)+'</button>'+
  '<span class="bd'+(p.cond==="Rất tốt"?" g":"")+'">'+p.cond+'</span>'+
  '<button class="fav" data-fav="'+p.id+'" aria-label="Yêu thích" aria-pressed="'+!!st.fav[p.id]+'">'+(st.fav[p.id]?"♥":"♡")+'</button>'+
  '<div class="pb"><button class="pn" data-open="'+p.id+'">'+esc(p.name)+'</button>'+
  '<div class="pr">'+money(p.price)+'</div>'+
  '<div class="sm">'+esc(p.use)+' · '+esc(p.health)+'</div>'+
  '<div class="sm"><span style="color:var(--gold)">★</span> '+p.rate+' ('+p.rev+') · '+esc(p.city)+'</div>'+
  '<label class="cmp"><input type="checkbox" data-cmp="'+p.id+'"'+(on?" checked":"")+'> So sánh</label></div></article>';
}
function home(){
  var l=filtered();
  return (st.cat==="Tất cả"&&!st.q&&!st.favOnly?'<div class="banner"><div><h1>Đồ cũ chính chủ,<br>giá tốt hơn mỗi ngày</h1><p>Thông tin tình trạng rõ ràng, người bán đã xác thực.</p></div><div class="perks"><span>🛡 '+BW+'</span><span>✓ Công khai khuyết điểm</span><span>🚚 Giao toàn quốc</span></div></div>':'')+
  '<div class="bar"><h2 style="font-size:20px">'+(st.favOnly?"Sản phẩm yêu thích":st.q?'Kết quả cho "'+esc(st.q)+'"':st.cat)+' <span class="sm">· '+l.length+' sản phẩm</span></h2>'+
  '<div style="display:flex;gap:10px"><label class="sr" for="cd" style="position:absolute;left:-9999px">Tình trạng</label><select id="cd"><option value="">Mọi tình trạng</option>'+["Rất tốt","Tốt","Khá"].map(function(c){return '<option'+(st.cond===c?" selected":"")+'>'+c+'</option>'}).join("")+'</select>'+
  '<label class="sr" for="so" style="position:absolute;left:-9999px">Sắp xếp</label><select id="so">'+[["new","Mới đăng"],["asc","Giá thấp đến cao"],["desc","Giá cao đến thấp"],["rate","Đánh giá cao nhất"]].map(function(o){return '<option value="'+o[0]+'"'+(st.sort===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></div></div>'+
  (l.length?'<div class="grid">'+l.map(card).join("")+'</div>':'<div class="empty"><h3>Không tìm thấy sản phẩm phù hợp</h3><p>Thử đổi từ khóa hoặc bỏ bớt bộ lọc.</p></div>');
}

/* ---------- chi tiết ---------- */
function detail(){
  var p=byId(st.cur); if(!p)return home();
  var on=st.cmp.indexOf(p.id)>=0;
  return '<button class="back" id="bk">‹ Quay lại</button><div class="two"><div class="big">'+img(p)+'</div><div>'+
  '<span class="bd g" style="position:static;display:inline-block">Đã sử dụng · '+p.cond+'</span>'+
  '<h1 style="font-size:30px;line-height:1.2;margin-top:8px">'+esc(p.name)+'</h1>'+
  '<div class="price-l">'+money(p.price)+'</div>'+
  '<p><span style="color:var(--gold)">★★★★★</span> <b>'+p.rate+'</b> <span class="sm">· '+p.rev+' đánh giá</span></p>'+
  '<div style="display:flex;gap:12px;align-items:center;margin:14px 0"><div style="width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--bink);display:grid;place-items:center;font-weight:800">'+esc(p.seller.charAt(0))+'</div><div><b>'+esc(p.seller)+'</b><br><span class="sm">Người bán đã xác thực · '+esc(p.city)+'</span></div></div>'+
  '<div class="box"><h2 style="font-size:18px;margin-bottom:6px">Thông tin sản phẩm</h2><table>'+
  [["Đã sử dụng",p.use],["Tình trạng",p.cond],["Pin / độ mới",p.health],["Khuyết điểm",p.flaws],["Phụ kiện",p.acc]].concat(p.specs).map(function(r){return '<tr><th>'+r[0]+'</th><td>'+esc(r[1])+'</td></tr>'}).join("")+'</table></div>'+
  '<div class="box" style="margin-top:14px;background:var(--soft);border-color:transparent"><b>Thông tin minh bạch</b><ul class="tick"><li>✓ Ảnh thực tế</li><li>✓ Đã khai báo tình trạng</li><li>✓ Công khai khuyết điểm</li><li>✓ '+BW+'</li></ul></div>'+
  '<div class="row"><button class="btn" data-buy="'+p.id+'" style="flex:1;min-width:140px">Mua ngay</button><button class="btn o" data-add="'+p.id+'" style="flex:1;min-width:140px">Thêm vào giỏ</button><button class="btn o" data-cmpbtn="'+p.id+'">'+(on?"Bỏ so sánh":"⇄ So sánh")+'</button></div></div></div>';
}

/* ---------- so sánh ---------- */
function compare(){
  var a=byId(st.cmp[0]),b=byId(st.cmp[1]); if(!a||!b)return home();
  var keys=[];[a,b].forEach(function(p){p.specs.forEach(function(s){if(keys.indexOf(s[0])<0)keys.push(s[0])})});
  function sv(p,k){var f=p.specs.filter(function(s){return s[0]===k})[0];return f?f[1]:"—"}
  var cheap=a.price===b.price?0:(a.price<b.price?1:2), top=a.rate===b.rate?0:(a.rate>b.rate?1:2);
  var rows=[["Giá",money(a.price),money(b.price),cheap],["Tình trạng",a.cond,b.cond,0],["Đã sử dụng",a.use,b.use,0],["Pin / độ mới",a.health,b.health,0],["Khuyết điểm",a.flaws,b.flaws,0],["Phụ kiện",a.acc,b.acc,0],["Đánh giá","★ "+a.rate+" ("+a.rev+")","★ "+b.rate+" ("+b.rev+")",top],["Người bán",a.seller+" · "+a.city,b.seller+" · "+b.city,0]]
   .concat(keys.map(function(k){return [k,sv(a,k),sv(b,k),0]}));
  var diff=Math.abs(a.price-b.price);
  function head(p){return '<td style="width:33%"><div class="big" style="max-width:200px;margin:0 0 10px">'+img(p)+'</div><b>'+esc(p.name)+'</b><div class="row" style="margin-top:8px"><button class="btn o" data-open="'+p.id+'" style="padding:7px 14px">Xem</button><button class="btn" data-add="'+p.id+'" style="padding:7px 14px">Thêm vào giỏ</button></div></td>'}
  return '<button class="back" id="bk">‹ Quay lại</button><h1 style="font-size:28px;margin-bottom:6px">So sánh sản phẩm</h1>'+
  '<p class="sm" style="margin-bottom:16px">'+(diff?esc((a.price<b.price?a:b).name)+' rẻ hơn '+money(diff)+'. ':"Hai sản phẩm có cùng mức giá. ")+'Mục nổi bật màu xanh là lựa chọn tốt hơn ở tiêu chí đó.</p>'+
  '<div class="box" style="overflow-x:auto"><table style="min-width:620px"><tr><th></th>'+head(a)+head(b)+'</tr>'+
  rows.map(function(r){return '<tr><th>'+r[0]+'</th><td class="'+(r[3]===1?"best":"")+'">'+esc(r[1])+(r[3]===1?" ✓":"")+'</td><td class="'+(r[3]===2?"best":"")+'">'+esc(r[2])+(r[3]===2?" ✓":"")+'</td></tr>'}).join("")+'</table></div>';
}

/* ---------- đăng bán ---------- */
var photos=[];
function sell(){
  return '<button class="back" id="bk">‹ Quay lại</button><div class="two"><div class="box"><h1 style="font-size:26px">Đăng sản phẩm</h1><p class="sm" style="margin:4px 0 16px">Cung cấp thông tin minh bạch để người mua đưa ra quyết định.</p>'+
  '<div class="fld"><label for="sn">Tên sản phẩm *</label><input id="sn" placeholder="Ví dụ: iPhone 12 – 64GB"></div>'+
  '<div class="fld"><label for="sc">Danh mục *</label><select id="sc">'+CAT.slice(1).map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></div>'+
  '<div class="fld"><label for="sp">Giá đề xuất (đồng) *</label><input id="sp" type="number" min="0" inputmode="numeric" placeholder="7000000"></div>'+
  '<div class="fld"><label for="sd">Tình trạng *</label><select id="sd"><option>Rất tốt</option><option selected>Tốt</option><option>Khá</option></select></div>'+
  '<div class="fld"><label for="su">Thời gian sử dụng</label><input id="su" placeholder="2 năm"></div>'+
  '<div class="fld"><label for="sh">Pin / độ mới</label><input id="sh" placeholder="Pin 86%"></div>'+
  '<div class="fld"><label for="sf2">Khuyết điểm</label><textarea id="sf2" rows="2" placeholder="Xước nhẹ ở cạnh máy."></textarea></div>'+
  '<div class="fld"><label for="sa">Phụ kiện</label><input id="sa" placeholder="Cáp sạc"></div></div>'+
  '<div class="box"><h2 style="font-size:20px">Hình ảnh sản phẩm</h2><p class="sm" style="margin:4px 0 12px">Ảnh thực tế giúp người mua đánh giá tình trạng. Ảnh đầu tiên là ảnh đại diện.</p>'+
  '<input type="file" id="ph" accept="image/*" multiple><div class="prev" id="prev"></div>'+
  '<button class="btn" id="post" style="margin-top:22px;width:100%">Đăng sản phẩm</button></div></div>';
}

/* ---------- vẽ lại ---------- */
function render(){
  $("#cats").innerHTML=CAT.map(function(c){return '<button class="chip" data-cat="'+c+'" aria-pressed="'+(!st.favOnly&&st.cat===c)+'">'+c+'</button>'}).join("");
  $("#view").innerHTML=st.view==="detail"?detail():st.view==="compare"?compare():st.view==="sell"?sell():home();
  var fc=Object.keys(st.fav).filter(function(k){return st.fav[k]}).length;
  $("#favN").textContent=fc||"";$("#cartN").textContent=st.cart.length||"";
  var tr=$("#tray");
  if(st.cmp.length&&st.view!=="compare"){
    tr.classList.add("on");
    var s=[0,1].map(function(i){var p=byId(st.cmp[i]);return p?'<div class="slot"><span class="th">'+img(p)+'</span><b>'+esc(p.name)+'</b></div>':'<div class="slot sm">Chọn thêm sản phẩm để so sánh</div>'});
    $("#trayIn").innerHTML=s.join("")+'<button class="btn" id="goCmp"'+(st.cmp.length<2?" disabled":"")+'>So sánh ngay</button><button class="btn o" id="clrCmp">Xóa</button>';
  }else tr.classList.remove("on");
  if(st.view==="sell")drawPrev();
}
function drawPrev(){var e=$("#prev");if(e)e.innerHTML=photos.map(function(s){return '<img src="'+s+'" alt="Ảnh sản phẩm đã chọn">'}).join("")}

/* ---------- giỏ hàng ---------- */
function openDlg(h){$("#dlg").innerHTML=h;$("#ov").classList.add("on")}
function closeDlg(){$("#ov").classList.remove("on")}
function cartDlg(){
  var items=st.cart.map(byId),sum=items.reduce(function(n,p){return n+p.price},0);
  openDlg('<h2 style="margin-bottom:8px">Giỏ hàng</h2>'+(items.length?items.map(function(p){return '<div class="ci"><span class="th">'+img(p)+'</span><div style="flex:1"><b>'+esc(p.name)+'</b><div class="sm">'+money(p.price)+'</div></div><button class="btn o" data-rm="'+p.id+'" style="padding:5px 12px">Xóa</button></div>'}).join("")+
  '<div style="display:flex;justify-content:space-between;margin:16px 0;font-size:18px"><b>Tổng cộng</b><b class="best">'+money(sum)+'</b></div><div class="row"><button class="btn o" id="cl">Tiếp tục mua</button><button class="btn" id="co" style="flex:1">Đặt hàng</button></div>':'<p class="empty">Giỏ hàng đang trống.</p><div class="row"><button class="btn" id="cl">Tiếp tục mua</button></div>'));
}
function add(id,quiet){if(st.cart.indexOf(id)>=0){if(!quiet)toast("Sản phẩm đã có trong giỏ (mỗi món đồ cũ chỉ có một).");return}st.cart.push(id);if(!quiet)toast("Đã thêm vào giỏ hàng.");render()}
function toggleCmp(id){
  var i=st.cmp.indexOf(id);
  if(i>=0)st.cmp.splice(i,1);
  else if(st.cmp.length>=2){toast("Chỉ so sánh được tối đa 2 sản phẩm. Hãy bỏ chọn một món trước.");render();return}
  else st.cmp.push(id);
  render();
}

/* ---------- sự kiện ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button,input,label");if(!t)return;
  var d=t.dataset;
  if(d.open){closeDlg();go("detail",+d.open)}
  else if(d.fav){var k=+d.fav;st.fav[k]=!st.fav[k];render()}
  else if(d.cat){st.cat=d.cat;st.favOnly=false;st.q="";$("#q").value="";go("home")}
  else if(d.add)add(+d.add);
  else if(d.buy){add(+d.buy,true);cartDlg()}
  else if(d.cmpbtn)toggleCmp(+d.cmpbtn);
  else if(d.rm){st.cart=st.cart.filter(function(x){return x!==+d.rm});render();cartDlg()}
  else if(t.id==="bk"){go("home")}
  else if(t.id==="goCmp"){go("compare")}
  else if(t.id==="clrCmp"){st.cmp=[];render()}
  else if(t.id==="cl"){closeDlg()}
  else if(t.id==="co"){var n=st.cart.length;st.cart=[];render();openDlg('<h2>Đặt hàng thành công</h2><p class="sm" style="margin:8px 0 16px">Đã gửi '+n+' sản phẩm tới người bán. Bạn sẽ nhận thông báo khi đơn được xác nhận.</p><button class="btn" id="cl">Về trang chủ</button>');st.view="home";render()}
  else if(t.id==="post"){publish()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.cmp){toggleCmp(+t.dataset.cmp)}
  else if(t.id==="cd"){st.cond=t.value;render()}
  else if(t.id==="so"){st.sort=t.value;render()}
  else if(t.id==="ph"){
    photos=[];var fs=Array.prototype.slice.call(t.files,0,6),left=fs.length;
    fs.forEach(function(f){var r=new FileReader();r.onload=function(){photos.push(r.result);if(--left===0)drawPrev()};r.readAsDataURL(f)});
  }
});
$("#sf").addEventListener("submit",function(e){e.preventDefault();st.q=$("#q").value.trim();st.cat="Tất cả";st.favOnly=false;go("home")});
$("#home").onclick=function(){st.q="";$("#q").value="";st.cat="Tất cả";st.favOnly=false;go("home")};
$("#favB").onclick=function(){st.favOnly=true;go("home")};
$("#cartB").onclick=cartDlg;
$("#sellB").onclick=function(){photos=[];go("sell")};
$("#ov").addEventListener("click",function(e){if(e.target.id==="ov")closeDlg()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDlg()});

function publish(){
  var n=$("#sn").value.trim(),pr=parseInt($("#sp").value,10);
  if(!n||!(pr>0)){toast("Vui lòng nhập tên sản phẩm và giá hợp lệ.");return}
  var cat=$("#sc").value,map={"Điện thoại":"phone","Laptop":"laptop","Máy tính bảng":"tab","Âm thanh":"head","Đồng hồ":"watch","Máy ảnh":"cam","Game":"game"};
  var p=P(nextId++,cat,map[cat]||"phone","#2E9E67",n,pr,$("#sd").value,$("#su").value.trim()||"Chưa rõ",$("#sh").value.trim()||"Chưa khai báo",$("#sf2").value.trim()||"Không có",$("#sa").value.trim()||"Không có","Bạn","TP.HCM",5,0,[],0);
  if(photos[0])p.photo=photos[0];
  PRODUCTS.push(p);photos=[];st.cat="Tất cả";st.q="";st.sort="new";toast("Đã đăng sản phẩm.");go("detail",p.id);
}
render();
})();
</script>
</body>
</html>
